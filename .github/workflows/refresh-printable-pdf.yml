name: Refresh printable WRO documentation

on:
  push:
    paths:
      - '.github/workflows/refresh-printable-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout documentation and images
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check "Markdown==3.9" "WeasyPrint==66.0"

      - name: Render README to print-ready PDF
        run: |
          cat > /tmp/render_readme.py <<'PY'
          from pathlib import Path
          import re
          import markdown
          from weasyprint import HTML, CSS

          root = Path.cwd()
          source = root / "README.md"
          dest = root / "output/pdf/WRO-2026-Future-Engineers-Documentation.pdf"
          dest.parent.mkdir(parents=True, exist_ok=True)
          text = source.read_text(encoding="utf-8")
          raw = markdown.markdown(
              text, extensions=["extra", "toc", "sane_lists"],
              output_format="html5"
          )

          css = r"""
          @page {
            size: A4;
            margin: 17mm 15mm 18mm 15mm;
            @bottom-left {
              content: "KU STEAM Pinkies  |  WRO 2026 Future Engineers";
              font-family: "DejaVu Sans", sans-serif;
              font-size: 7pt;
              color: #7a8798;
            }
            @bottom-right {
              content: counter(page);
              font-family: "DejaVu Sans", sans-serif;
              font-size: 8pt;
              color: #7a8798;
            }
          }
          html { font-size: 10pt; }
          body {
            font-family: "DejaVu Sans", sans-serif;
            font-size: 9.3pt;
            line-height: 1.43;
            color: #263342;
          }
          h1, h2, h3 { color: #173b5f; break-after: avoid; }
          h1 {
            font-size: 20pt;
            line-height: 1.18;
            border-bottom: 2px solid #2377b8;
            padding-bottom: 6pt;
            margin-top: 8pt;
            break-before: page;
          }
          h1:first-of-type { break-before: auto; }
          h2 {
            font-size: 14.2pt;
            border-bottom: 0.65pt solid #d4e3f1;
            padding-bottom: 3pt;
            margin: 17pt 0 8pt;
          }
          h3 { font-size: 11.2pt; margin: 13pt 0 6pt; }
          p { margin: 5pt 0 9pt; orphans: 3; widows: 3; }
          a { color: #145e97; text-decoration: none; overflow-wrap: anywhere; }
          ul, ol { padding-left: 18pt; margin: 5pt 0 10pt; }
          li { margin: 3pt 0; }
          strong { color: #1c3045; }
          img {
            max-width: 100%;
            max-height: 225mm;
            height: auto;
            object-fit: contain;
          }
          table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin: 9pt 0 12pt;
          }
          table th, table td {
            border: .55pt solid #cbd8e4;
            padding: 5pt 5pt;
            vertical-align: top;
            overflow-wrap: anywhere;
            font-size: 7.5pt;
            line-height: 1.35;
          }
          table th { background: #eaf2f8; color: #143b5a; font-weight: 700; }
          table img { max-width: 100%; height: auto; }
          thead { display: table-header-group; }
          tr { break-inside: avoid; }
          pre {
            font-family: "DejaVu Sans Mono", monospace;
            font-size: 7.2pt;
            line-height: 1.34;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            border-left: 2.5pt solid #6aa5d1;
            background: #f1f5f9;
            padding: 8pt;
            margin: 8pt 0 11pt;
          }
          code {
            font-family: "DejaVu Sans Mono", monospace;
            font-size: .87em;
            overflow-wrap: anywhere;
          }
          pre code { font-size: inherit; }
          blockquote {
            border-left: 3pt solid #adcce2;
            padding: 2pt 10pt;
            margin: 8pt 0;
            color: #4d6376;
          }
          hr { border: 0; border-top: 1pt solid #d5e1ea; margin: 14pt 0; }
          """

          html = (
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              '<title>WRO 2026 Future Engineers - KU STEAM Pinkies</title>'
              '</head><body>' + raw + '</body></html>'
          )
          local_sources = re.findall(r'<img[^>]+src=["\']([^"\']+)', raw)
          missing = [s for s in local_sources if not s.startswith(('http:', 'https:', 'data:')) and not (root / s).exists()]
          if missing:
              raise RuntimeError("Missing README images: " + ", ".join(missing))
          HTML(string=html, base_url=root.as_uri() + "/").write_pdf(
              str(dest), stylesheets=[CSS(string=css)]
          )
          if dest.stat().st_size < 50000:
              raise RuntimeError("Unexpectedly small generated PDF")
          print(f"Generated {dest}: {dest.stat().st_size} bytes; {len(local_sources)} images")
          PY
          python /tmp/render_readme.py

      - name: Check updated technical details in PDF
        run: |
          python -m pip install --disable-pip-version-check pypdf
          python - <<'PY'
          from pypdf import PdfReader
          path = "output/pdf/WRO-2026-Future-Engineers-Documentation.pdf"
          pages = PdfReader(path).pages
          text = "\n".join(p.extract_text() or "" for p in pages)
          for term in ["12040", "HK01693", "TB6612FNG", "N20", "BNO085", "VL53L1X", "Rebuilding the robot"]:
              assert term in text, f"Missing in updated PDF: {term}"
          assert "MP80495" not in text, "Obsolete alternative driver present in PDF"
          print(f"Verified {len(pages)} A4 pages and exact motor-driver data")
          PY

      - name: Commit refreshed PDF to the main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf/WRO-2026-Future-Engineers-Documentation.pdf
          if git diff --cached --quiet; then
            echo "PDF is already synchronized."
          else
            git commit -m "docs(pdf): synchronize printable documentation with latest README"
            git push origin HEAD:main
          fi
