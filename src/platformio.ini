; PlatformIO Project Configuration File
;
; Two explicit competition environments are provided so challenge mode is
; reproducible from the build command and never selected by editing main.cpp.

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    Wire
    adafruit/Adafruit BNO08x
    madhephaestus/ESP32Servo@^3.1.3
    pololu/VL53L1X@^1.3.1
    robtillaart/RunningAverage @ ^0.4.9
    arduino12/pixy2@^1.0.4

[env:open_challenge]
build_flags =
    -DWRO_CHALLENGE_MODE=0

[env:obstacle_challenge]
build_flags =
    -DWRO_CHALLENGE_MODE=1
